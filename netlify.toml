[build]
  publish = "."

# 모든 data/*.json — 1분 캐시 (실시간 데이터 우선)
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# HTML — 5분 캐시
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

# 이미지 — 7일 캐시
[[headers]]
  for = "/data/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
