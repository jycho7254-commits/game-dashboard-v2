[build]
  command = "python3 build_dashboard.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

# softc_data.json — 1분 캐시 (실시간 데이터)
[[headers]]
  for = "/data/softc_data.json"
  [headers.values]
    Cache-Control = "public, max-age=60"

# HTML — 5분 캐시
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

# 정적 에셋 — 1일 캐시
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# 이미지 — 7일 캐시
[[headers]]
  for = "/data/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
